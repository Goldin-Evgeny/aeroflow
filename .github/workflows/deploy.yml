# Builds the studio app and deploys it to an S3 bucket behind CloudFront.
# Requires these GitHub repo secrets:
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION
#   AEROFLOW_S3_BUCKET, AEROFLOW_CF_DISTRIBUTION_ID
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Prevent overlapping deploys.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Sync to S3
        run: |
          # Hashed assets: long cache. index.html + non-hashed: no cache.
          aws s3 sync apps/studio/dist "s3://${{ secrets.AEROFLOW_S3_BUCKET }}" \
            --delete --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"
          aws s3 cp apps/studio/dist/index.html "s3://${{ secrets.AEROFLOW_S3_BUCKET }}/index.html" \
            --cache-control "no-cache"
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.AEROFLOW_CF_DISTRIBUTION_ID }}" \
            --paths "/*"
